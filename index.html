<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRZKY CODE</title>
<style>
  :root { --g: #00ff5a; --g2: #00b83f; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Courier New", Courier, monospace; color: var(--g); }

  #rain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* judul di tengah */
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; text-align: center; padding: 1rem; }
  h1 {
    font-size: clamp(2.2rem, 10vw, 7rem);
    letter-spacing: .08em; font-weight: 700; color: var(--g);
    text-shadow: 0 0 8px var(--g), 0 0 28px var(--g2), 0 0 60px var(--g2);
    background: rgba(0,0,0,.55); padding: .15em .4em; position: relative;
  }
  h1::before, h1::after { content: attr(data-t); position: absolute; inset: 0; padding: inherit; background: transparent; }
  h1::before { color: #0ff; transform: translate(-2px,0); clip-path: inset(0 0 60% 0); animation: gl 3.2s infinite steps(1); mix-blend-mode: screen; text-shadow: none; }
  h1::after  { color: #f0f; transform: translate(2px,0);  clip-path: inset(55% 0 0 0); animation: gl 2.7s infinite steps(1) reverse; mix-blend-mode: screen; text-shadow: none; }
  @keyframes gl {
    0%,88%,100% { transform: translate(0,0); opacity: 0; }
    90% { transform: translate(-4px,1px); opacity: .9; }
    93% { transform: translate(3px,-1px); opacity: .9; }
    96% { transform: translate(-2px,0); opacity: .9; }
  }
  .sub { margin-top: .8rem; font-size: clamp(.8rem, 2.4vw, 1.1rem); color: var(--g); text-shadow: 0 0 8px var(--g2); background: rgba(0,0,0,.55); display: inline-block; padding: .2em .6em; }
  .sub::after { content: "_"; animation: bl 1s steps(1) infinite; }
  @keyframes bl { 50% { opacity: 0; } }


  /* tombol suara */
  #snd {
    position: fixed; right: 14px; bottom: 14px; z-index: 5; font: inherit; font-size: .85rem;
    color: var(--g); background: rgba(0,0,0,.7); border: 1px solid var(--g2); padding: .5em .9em; cursor: pointer;
  }
  #snd:hover, #snd:focus-visible { border-color: var(--g); outline: none; box-shadow: 0 0 10px var(--g2); }

  /* player YouTube disembunyikan tapi tetap aktif */
  #yt { position: fixed; left: 0; bottom: 0; width: 220px; height: 220px; opacity: 0.01; pointer-events: none; z-index: -1; }
  #yt.off { display: none; }

  @media (prefers-reduced-motion: reduce) { h1::before, h1::after { animation: none; opacity: 0; } .sub::after { animation: none; } }
</style>
</head>
<body>

<canvas id="rain"></canvas>

<div class="center">
  <div>
    <h1 data-t="FRZKY CODE">FRZKY CODE</h1>
  </div>
</div>

<button id="snd" aria-label="Matikan atau nyalakan suara">SUARA: OFF (klik di mana saja)</button>
<div id="yt"></div>

<script>
/* ---------- MATRIX RAIN ---------- */
(function () {
  var c = document.getElementById("rain"), x = c.getContext("2d");
  var chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFXYZ<>{}[]/\\=+*#$%&".split("");
  var size = 18, cols, drops;
  function resize() {
    var d = window.devicePixelRatio || 1;
    c.width = innerWidth * d; c.height = innerHeight * d;
    x.setTransform(d, 0, 0, d, 0, 0);
    size = innerWidth < 600 ? 14 : 18;
    cols = Math.ceil(innerWidth / size);
    drops = [];
    for (var i = 0; i < cols; i++) drops[i] = Math.random() * -50;
    x.fillStyle = "#000"; x.fillRect(0, 0, innerWidth, innerHeight);
  }
  resize(); addEventListener("resize", resize);

  var last = 0;
  function draw(t) {
    requestAnimationFrame(draw);
    if (t - last < 45) return; last = t;
    x.fillStyle = "rgba(0,0,0,0.08)";
    x.fillRect(0, 0, innerWidth, innerHeight);
    x.font = size + "px monospace";
    for (var i = 0; i < cols; i++) {
      var ch = chars[(Math.random() * chars.length) | 0];
      var px = i * size, py = drops[i] * size;
      x.fillStyle = "#d8ffe4"; x.fillText(ch, px, py);          /* kepala tetesan: putih kehijauan */
      x.fillStyle = "#00ff5a"; x.fillText(chars[(Math.random() * chars.length) | 0], px, py - size);
      if (py > innerHeight && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  requestAnimationFrame(draw);
})();

/* ---------- MUSIK (autoplay) ---------- */
/* PILIH SALAH SATU:
   1) File MP3 lokal -> isi AUDIO_SRC (mis. "musik.mp3", taruh sefolder dengan index.html). Paling stabil, jalan juga di file://
   2) YouTube -> kosongkan AUDIO_SRC dan isi VIDEO_ID (harus lewat http/https, video harus boleh di-embed) */
var AUDIO_SRC = "";
var VIDEO_ID = "36Q29xD2aGQ";

var player, audio, ready = false, soundOn = false, unlocked = false, errMsg = "";
var snd = document.getElementById("snd");

function label() {
  if (errMsg) { snd.textContent = errMsg; return; }
  snd.textContent = soundOn ? "SUARA: ON" : (unlocked ? "SUARA: OFF" : "SUARA: OFF (klik di mana saja)");
}

function isMuted() { return AUDIO_SRC ? audio.muted : player.isMuted(); }
function setMuted(m) {
  if (AUDIO_SRC) { audio.muted = m; if (!m) { audio.volume = 1; audio.play().catch(function () {}); } }
  else { if (m) player.mute(); else { player.unMute(); player.setVolume(100); player.playVideo(); } }
  soundOn = !m; label();
}
function turnOn() { try { setMuted(false); } catch (err) {} }

/* browser hanya mengizinkan suara setelah ada interaksi: klik/sentuh/tombol pertama langsung nyalakan suara */
var evts = ["pointerdown", "touchstart", "keydown", "wheel"];
function unlock() {
  if (unlocked) return;
  unlocked = true;
  evts.forEach(function (n) { removeEventListener(n, unlock, true); });
  if (ready) turnOn();
}
evts.forEach(function (n) { addEventListener(n, unlock, true); });

snd.addEventListener("click", function (e) {
  e.stopPropagation();
  if (!ready) return;
  unlocked = true;
  setMuted(!isMuted());
});

if (AUDIO_SRC) {
  /* ---- mode MP3 ---- */
  audio = new Audio(AUDIO_SRC);
  audio.loop = true; audio.preload = "auto";
  audio.onerror = function () { errMsg = "MUSIK GAGAL: file " + AUDIO_SRC + " tidak ditemukan"; label(); };
  ready = true;
  audio.volume = 1; audio.muted = false;
  audio.play().then(function () { soundOn = true; unlocked = true; label(); })
    .catch(function () { audio.muted = true; audio.play().catch(function () {}); soundOn = false; label(); if (unlocked) turnOn(); });
} else {
  /* ---- mode YouTube ---- */
  if (location.protocol === "file:") { errMsg = "MUSIK GAGAL: YouTube tidak jalan lewat file://. Upload ke hosting, atau pakai AUDIO_SRC (mp3)"; label(); }
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () { errMsg = "MUSIK GAGAL: YouTube API tidak bisa dimuat (cek internet)"; label(); };
  document.head.appendChild(tag);
}

function onYouTubeIframeAPIReady() {
  var vars = { autoplay: 1, controls: 0, loop: 1, playlist: VIDEO_ID, playsinline: 1, rel: 0 };
  if (location.protocol.indexOf("http") === 0) vars.origin = location.origin;
  player = new YT.Player("yt", {
    width: "220", height: "220", videoId: VIDEO_ID, playerVars: vars,
    events: {
      onReady: function (e) {
        ready = true;
        try { e.target.unMute(); e.target.setVolume(100); e.target.playVideo(); } catch (err) {}
        /* kalau browser memblokir suara, putar muted dulu lalu nyalakan di interaksi pertama */
        setTimeout(function () {
          if (player.getPlayerState() === 1 && !player.isMuted()) { soundOn = true; unlocked = true; label(); return; }
          player.mute(); player.playVideo(); soundOn = false; label();
          if (unlocked) turnOn();
        }, 1500);
      },
      onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED) player.playVideo(); },
      onError: function (e) {
        var why = { 2: "ID video salah", 5: "error player HTML5", 100: "video dihapus/privat", 101: "pemilik melarang embed", 150: "pemilik melarang embed", 153: "embed ditolak (buka lewat http/https)" }[e.data] || "tidak diketahui";
        errMsg = "MUSIK GAGAL (error " + e.data + ": " + why + ")"; label();
      }
    }
  });
}
</script>
</body>
</html>
