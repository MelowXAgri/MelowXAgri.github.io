<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRZKY CODE</title>
<style>
  :root { --g: #f2f2f2; --g2: #9a9a9a; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Courier New", Courier, monospace; color: var(--g); }

  #rain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; filter: contrast(1.15) brightness(.9); animation: flick .12s infinite steps(2); }
  @keyframes flick { 0% { opacity: .96; } 100% { opacity: 1; } }

  /* efek layar TV: garis scan, pita bergulir, vignette */
  .scan { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,0) 4px); }
  .roll { position: fixed; left: 0; right: 0; top: -20%; height: 18%; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.12), rgba(255,255,255,0)); animation: roll 6s linear infinite; }
  @keyframes roll { to { transform: translateY(650%); } }
  .vig { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }


  /* sigil muncul-hilang di berbagai sisi layar */
  .sigil { position: fixed; z-index: 1; pointer-events: none; opacity: 0; border-radius: 50%; will-change: opacity, transform;
    filter: drop-shadow(0 0 10px rgba(255,255,255,.55)); user-select: none; -webkit-user-drag: none; }
  .sigil.show { animation: sg var(--d, 1.6s) linear forwards; }
  @keyframes sg {
    0%   { opacity: 0; transform: translate(0,0); }
    6%   { opacity: .9; transform: translate(-3px,0); }
    10%  { opacity: .15; transform: translate(2px,0); }
    14%  { opacity: .95; transform: translate(0,0); }
    70%  { opacity: .85; transform: translate(0,0); }
    76%  { opacity: .2; transform: translate(2px,0); }
    82%  { opacity: .8; transform: translate(-2px,0); }
    100% { opacity: 0; transform: translate(0,0); }
  }

  /* salib terbalik */
  .cross { display: block; margin: 0 auto .5rem; width: clamp(60px, 14vw, 120px); height: auto; filter: drop-shadow(0 0 6px rgba(255,255,255,.8)) drop-shadow(0 0 22px rgba(255,255,255,.35)); animation: crossflick 4s infinite steps(1); }
  .cross rect { fill: #f2f2f2; }
  @keyframes crossflick { 0%,91%,100% { transform: translate(0,0); opacity: 1; } 92% { transform: translate(-3px,0); opacity: .6; } 94% { transform: translate(3px,1px); opacity: 1; } 96% { transform: translate(0,0); opacity: .75; } }

  /* judul di tengah */
  .center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; text-align: center; padding: 1rem; }
  h1 {
    font-size: clamp(2.2rem, 10vw, 7rem);
    letter-spacing: .08em; font-weight: 700; color: var(--g);
    text-shadow: 0 0 6px rgba(255,255,255,.8), 0 0 24px rgba(255,255,255,.35);
    background: rgba(0,0,0,.78); padding: .15em .45em; position: relative;
  }
  h1::before, h1::after { content: attr(data-t); position: absolute; inset: 0; padding: inherit; background: transparent; }
  h1::before { color: #0ff; transform: translate(-2px,0); clip-path: inset(0 0 60% 0); animation: gl 3.2s infinite steps(1); mix-blend-mode: screen; text-shadow: none; }
  h1::after  { color: #f0f; transform: translate(2px,0);  clip-path: inset(55% 0 0 0); animation: gl 2.7s infinite steps(1) reverse; mix-blend-mode: screen; text-shadow: none; }
  @keyframes gl {
    0%,88%,100% { transform: translate(0,0); opacity: 0; }
    90% { transform: translate(-4px,1px); opacity: .9; }
    93% { transform: translate(3px,-1px); opacity: .9; }
    96% { transform: translate(-2px,0); opacity: .9; }
  }
  .sub { margin-top: .8rem; font-size: clamp(.8rem, 2.4vw, 1.1rem); color: var(--g); text-shadow: 0 0 8px var(--g2); background: rgba(0,0,0,.55); display: inline-block; padding: .2em .6em; }
  .sub::after { content: "_"; animation: bl 1s steps(1) infinite; }
  @keyframes bl { 50% { opacity: 0; } }


  /* tombol suara */
  #snd {
    position: fixed; right: 14px; bottom: 14px; z-index: 5; font: inherit; font-size: .85rem;
    color: var(--g); background: rgba(0,0,0,.7); border: 1px solid var(--g2); padding: .5em .9em; cursor: pointer;
  }
  #snd:hover, #snd:focus-visible { border-color: var(--g); outline: none; box-shadow: 0 0 10px var(--g2); }

  /* player SoundCloud disembunyikan tapi tetap aktif */
  #sc { position: fixed; left: 0; bottom: 0; width: 300px; height: 166px; border: 0; opacity: 0.01; pointer-events: none; z-index: -1; }

  /* portal masuk */
  #gate { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.84); display: grid; place-items: center; text-align: center; cursor: pointer; padding: 1rem; }
  #gate button {
    font: inherit; font-size: clamp(1.1rem, 3.4vw, 1.6rem); color: var(--g); background: transparent;
    border: 1px solid var(--g); padding: .9em 1.8em; letter-spacing: .2em; cursor: pointer;
    text-shadow: 0 0 8px rgba(255,255,255,.6); box-shadow: 0 0 18px rgba(255,255,255,.18), inset 0 0 18px rgba(255,255,255,.06);
    animation: gp 2.4s ease-in-out infinite;
  }
  #gate button:hover, #gate button:focus-visible { background: var(--g); color: #000; text-shadow: none; outline: none; animation: none; }
  #gate p { margin-top: 1rem; color: var(--g2); font-size: .85rem; letter-spacing: .08em; }
  @keyframes gp { 50% { box-shadow: 0 0 34px rgba(255,255,255,.4), inset 0 0 22px rgba(255,255,255,.12); } }

  @media (prefers-reduced-motion: reduce) { #rain, .roll { animation: none; } h1::before, h1::after { animation: none; opacity: 0; } .sub::after { animation: none; } #gate button { animation: none; } .cross { animation: none; } .sigil.show { animation-duration: 0.01s; } }
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="scan"></div>
<div class="roll"></div>
<div class="vig"></div>

<div class="center">
  <div>
    <svg class="cross" viewBox="0 0 100 150" role="img" aria-label="Salib terbalik">
      <rect x="44" y="4" width="12" height="142"/>
      <rect x="14" y="92" width="72" height="12"/>
    </svg>
    <h1 data-t="FRZKY CODE">FRZKY CODE</h1>
  </div>
</div>

<button id="snd" hidden aria-label="Status musik"></button>
<iframe id="sc" title="musik" allow="autoplay" tabindex="-1" aria-hidden="true"></iframe>

<div id="gate">
  <div>
    <button id="enter">[ MASUK ]</button>
    <p>klik untuk masuk</p>
  </div>
</div>

<script>
/* ---------- TV STATIC (tidak ada sinyal) ---------- */
(function () {
  var c = document.getElementById("rain"), x = c.getContext("2d");
  var img, buf, w, h, SCALE = 3;
  function resize() {
    w = Math.ceil(innerWidth / SCALE); h = Math.ceil(innerHeight / SCALE);
    c.width = w; c.height = h;
    img = x.createImageData(w, h);
    buf = new Uint32Array(img.data.buffer);
  }
  resize(); addEventListener("resize", resize);

  var last = 0, tear = 0;
  function draw(t) {
    requestAnimationFrame(draw);
    if (t - last < 50) return; last = t;           /* ~20 fps, seperti noise TV */
    var n = buf.length, i, v;
    for (i = 0; i < n; i++) {
      v = (Math.random() * 255) | 0;
      buf[i] = 0xFF000000 | (v << 16) | (v << 8) | v;
    }
    /* sesekali ada garis robek horizontal yang lebih terang */
    if (Math.random() < 0.15) tear = (Math.random() * h) | 0;
    if (tear) {
      var rows = 2 + ((Math.random() * 4) | 0), start = tear * w, end = Math.min(n, start + rows * w);
      for (i = start; i < end; i++) { v = 170 + ((Math.random() * 85) | 0); buf[i] = 0xFF000000 | (v << 16) | (v << 8) | v; }
      if (Math.random() < 0.3) tear = 0;
    }
    x.putImageData(img, 0, 0);
  }
  requestAnimationFrame(draw);
})();

    var cw = W / cols, ch = H / rows, size = Math.max(56, Math.min(150, Math.min(cw, ch) * 0.6));
    var list = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1)
        list.push({ id: r + "," + c, x: c * cw + (cw - size) / 2, y: r * ch + (ch - size) / 2, size: size });
    }
    return list;
  }

  function place(el) {
    var cells = edgeCells().filter(function (c) { return !used[c.id]; });
    if (!cells.length) return null;
    var cell = cells[(Math.random() * cells.length) | 0];
    used[cell.id] = true;
    el.style.width = el.style.height = Math.round(cell.size) + "px";
    el.style.left = Math.round(cell.x) + "px";
    el.style.top = Math.round(cell.y) + "px";
    el.style.setProperty("--d", rnd(1.4, 2.4).toFixed(2) + "s");
    return cell.id;
  }

  function cycle(el) {
    el.classList.remove("show");
    void el.offsetWidth;                            /* restart animasi */
    var id = place(el);
    if (id === null) { setTimeout(function () { cycle(el); }, 500); return; }
    el.classList.add("show");
    var dur = parseFloat(el.style.getPropertyValue("--d")) * 1000;
    setTimeout(function () { delete used[id]; cycle(el); }, dur + rnd(500, 1500));
  }

  for (var i = 0; i < SLOTS; i++) {
    var im = new Image();
    im.src = SRC; im.className = "sigil"; im.alt = ""; im.draggable = false;
    document.body.appendChild(im);
    (function (el, delay) { setTimeout(function () { cycle(el); }, delay); })(im, i * 600 + rnd(0, 500));
  }
})();

/* ---------- MUSIK SOUNDCLOUD (mulai saat klik MASUK) ---------- */
var SC_URL = "https://soundcloud.com/bring-me-the-horizon/crucify-me";   /* ganti link lagu di sini */

var widget, ready = false, wantPlay = false, playing = false, errMsg = "";
var snd = document.getElementById("snd"), gate = document.getElementById("gate"), frame = document.getElementById("sc");
function showErr(m) { errMsg = m; snd.hidden = false; snd.textContent = m; }

frame.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(SC_URL) +
  "&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false";

var api = document.createElement("script");
api.src = "https://w.soundcloud.com/player/api.js";
api.onload = function () {
  widget = SC.Widget(frame);
  widget.bind(SC.Widget.Events.READY, function () {
    ready = true; widget.setVolume(100);
    if (wantPlay) start();
  });
  widget.bind(SC.Widget.Events.PLAY, function () { playing = true; retryEvts.forEach(function (n) { removeEventListener(n, retry, true); }); });
  widget.bind(SC.Widget.Events.FINISH, function () { widget.seekTo(0); widget.play(); });   /* ulang terus */
  widget.bind(SC.Widget.Events.ERROR, function () { showErr("MUSIK GAGAL: SoundCloud menolak memutar lagu ini"); });
};
api.onerror = function () { showErr("MUSIK GAGAL: SoundCloud tidak bisa dimuat (cek internet)"); };
document.head.appendChild(api);

function start() {
  try { widget.setVolume(100); widget.play(); } catch (e) {}
  /* kalau belum benar-benar jalan, coba lagi di interaksi berikutnya */
  setTimeout(function () {
    if (!playing) retryEvts.forEach(function (n) { addEventListener(n, retry, true); });
  }, 1500);
}
var retryEvts = ["pointerdown", "touchend", "click", "keydown"];
function retry() { if (!playing && ready) { try { widget.play(); } catch (e) {} } }

/* klik MASUK = interaksi sah, jadi browser mengizinkan musik berbunyi */
function enter() {
  gate.removeEventListener("click", enter);
  gate.style.transition = "opacity .7s"; gate.style.opacity = 0;
  setTimeout(function () { gate.remove(); }, 750);
  wantPlay = true;
  if (ready) start();
}
gate.addEventListener("click", enter);
</script>
